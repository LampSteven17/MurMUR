# Example murmur cluster configuration.
#
# Two-file pattern:
#   cluster.yaml   — this file, committed/shareable, uses ${VAR} for secrets
#   cluster.env    — gitignored, KEY=value pairs, loaded before YAML parse
#
# Resolution order (first match wins):
#   $MURMUR_CONFIG  |  ./cluster.yaml  |  ~/.config/murmur/cluster.yaml
# Env file is looked up alongside the chosen config (same dir, `cluster.env`)
# or via $MURMUR_ENV.
#
# Any string value may use ${VAR}. Resolution happens at load; missing vars
# fail loudly with a pointer to which field needed them.

cluster:
  name: example
  domain: example.net              # used for hostname/DNS conventions

  api:
    endpoint: https://10.0.0.10:8006
    token_id: automation@pve!murmur
    token_secret: ${PROXMOX_TOKEN_SECRET}
    tls_skip_verify: true          # ProxMox usually self-signs

  # All nodes. `address` is for SSH; the API uses cluster.api.endpoint.
  # Roles are free-form labels murmur uses to make placement choices.
  nodes:
    - { name: pve1, address: 10.0.0.11, roles: [compute, templates] }
    - { name: pve2, address: 10.0.0.12, roles: [compute] }
    - { name: pve3, address: 10.0.0.13, roles: [compute] }
    # ...

  # ProxMox storage IDs (as they appear in `pvesh get /storage`).
  # Validated at config-load by hitting the API; missing IDs fail loudly.
  storage:
    vm_disk: ceph-rbd              # VM/LXC root disks
    shared:  cephfs                # snippets, templates
    iso:     cephfs                # cloud-image / ISO uploads

  network:
    default_bridge: vmbr0
    default_vlan: null             # set if cluster uses VLAN tagging by default

  # Guest auth + per-distro defaults for cloud-init.
  #
  # AT LEAST ONE of `identity` (key) or `password` (password) must be set
  # for VM deploys, otherwise the guest is unreachable. Both can coexist —
  # the guest accepts either.
  #
  # Convention: keep per-operator values (paths, secrets) out of this file
  # by using ${VAR} references resolved from cluster.env. Then cluster.yaml
  # stays identical across operators and only cluster.env differs.
  ssh:
    identity: ${SSH_IDENTITY}            # private key path; .pub is injected to cloud-init
    # password: ${GUEST_DEFAULT_PASSWORD} # uncomment + define in cluster.env to enable password auth
    users:
      # fedora/debian/ubuntu/alpine/rocky/arch are builtin; override here
      alpine: root

# --- Optional sections below ---

# Operators (multi-user mode). Each entry binds a murmur identity (the
# `name`) to a backing ProxMox user + token. cluster.api.token_* is ignored
# whenever this section is non-empty.
#
# Identity at launch is selected in order:
#   1. --as <name>            (CLI flag)
#   2. $MURMUR_USER           (env var)
#   3. single-entry default   (when users: has exactly one entry)
#   4. credential inference   (the one operator whose token_secret is set in
#                              cluster.env — since each operator's env holds
#                              only their own token, that's an unambiguous "me")
#   5. error                  (lists available names)
#
# token_secret is resolved LAZILY: only the active operator's referenced
# ${VAR} needs to be set in cluster.env. Other operators' tokens stay
# unresolved in this process so each operator's cluster.env contains only
# their own secret. Step 4 leans on exactly this: adding operators to the
# shared cluster.yaml never breaks your no-arg launch, because only your token
# is present in your env.
#
# OMIT this section entirely to keep v0.1 single-operator behavior (the
# cluster.api.token_* values are used directly as an implicit admin).
users:
  - name: alice                                    # short identity used by --as / MURMUR_USER
    role: deployer                                 # must match a name from roles: (or a builtin)
    proxmox_user: alice@pve                        # backing PVE user (must exist)
    proxmox_token: murmur                          # token name; full id is "alice@pve!murmur"
    token_secret: ${ALICE_TOKEN}                   # resolved at identity-selection time
    ssh_pubkey: ssh-ed25519 AAAA... alice@laptop   # optional; guests alice deploys trust this key.
                                                   # Blank → falls back to cluster.ssh.identity. The
                                                   # matching private key stays on alice's machine.
    comment: Alice — application deployer

  - name: bob
    role: admin
    proxmox_user: bob@pve
    proxmox_token: murmur
    token_secret: ${BOB_TOKEN}

# Roles bundle permissions across the TUI. Two builtins ship and are used
# when this section is absent: admin / deployer. Entries here EXTEND the
# builtins; a name collision OVERRIDES the builtin.
#
#   tabs:    which tab keys the operator sees in the top bar
#            (overview, apps, deploy, teardown, update, patch, users).
#            ['*'] = all tabs. Tabs not in the list are hidden.
#   actions: high-level orchestrator operations gated for this role
#            (deploy, teardown, patch, host-update, manage-users).
#            ['*'] = all. Empty = read-only.
#   apps:    names from the apps: catalog this role can deploy. ['*'] = all,
#            [] = none.
#   guests:  "own" → list views filter to murmur-owner=<active-user> tagged
#            guests. "all" → see everything (admin default).
roles:
  - name: lab-only-deployer                        # extends the builtin set
    tabs:    [overview, apps, deploy, patch]
    actions: [deploy, patch]
    apps:    [edge-connector, twingate-connector]  # narrowed catalog
    guests:  own

# Flavor catalog. Murmur ships a default set; entries here EXTEND it,
# and a name collision OVERRIDES the builtin.
flavors:
  - { name: 16vcpu.32gb, cpu: 16, memory_mb: 32768, disk_gb: 256 }

# Image catalog. Same merge semantics as flavors.
images:
  - name:   debian-13-custom
    distro: debian
    url:    https://internal.example/debian-13-hardened.qcow2

# App catalog. Each entry is a declarative VM-plus-configuration unit that
# the [a]apps tab can deploy/teardown, the [u]pdate tab can rebuild, and
# the [p]atch tab can re-run `update:` against in-place.
#
#   type:         "vm" (default) or "lxc". LXCs are much lighter (~256MB
#                 RAM, no kernel) — good for thin connector-style apps.
#   image:        references images: above OR a builtin (debian, ubuntu, ...)
#   flavor:       references flavors: above OR a builtin (1vcpu.1gb, ...)
#   playbook:     relative path to an ansible playbook (run post-deploy)
#   post_deploy:  raw shell command — alternative to playbook (mutually exclusive)
#   update:       shell command run via SSH for [p]atch — typically
#                 "cd /opt/<name> && docker compose pull && docker compose up -d"
#                 or an ansible-playbook re-run. Apps without `update:` don't
#                 show up in the patch picker.
#   update_check: optional shell command that prints "UPDATES:n/total" so the
#                 patch tab can show update availability. If empty, murmur
#                 runs a generic docker-compose digest check against
#                 /opt/<name>/. Override for non-compose apps (apt, native
#                 binaries) or apps with custom image-resolution.
#   match_all:    true ⇒ patch/inspect fans out across EVERY guest whose name
#                 matches `name`. Use for replicated services (one connector
#                 per node, etc.). False/omitted ⇒ exactly one guest is
#                 expected. Combined with deploy: murmur fans out per node,
#                 one replica per cluster.nodes entry.
#   secrets:      list of per-replica secrets the operator pastes at deploy
#                 time. Each entry has `name` (env var exported to
#                 post_deploy) and optional `prompt`. Used for things like
#                 Twingate access/refresh tokens that differ per replica and
#                 don't belong in cluster.env.
#   route:        reverse-proxy hint stamped VERBATIM on the guest's PVE
#                 description at deploy. An external sync tool reads it and
#                 publishes the route — murmur doesn't run the proxy. The
#                 string format is whatever that tool parses, e.g.
#                 "traefik-port:8080" (subdomain = guest name) or
#                 "traefik:grafana:3000" (explicit subdomain). Omit ⇒ nothing
#                 stamped (unless reverse_proxy.description_template below).
apps:
  - name: webapp
    image: debian-13-custom
    flavor: 16vcpu.32gb
    playbook: playbooks/webapp.yml
    update: cd /opt/webapp && docker compose pull && docker compose up -d
    route: traefik-port:8080   # published at webapp.<domain> -> :8080

  - name: static-cache
    image: debian-13
    flavor: 1vcpu.2gb
    post_deploy: |
      apt-get update && apt-get install -y nginx &&
      systemctl enable --now nginx

  # One connector per compute node — match_all makes patching iterate
  # over every guest named "edge-connector" (e.g. one per host).
  - name: edge-connector
    image: debian-13
    flavor: 1vcpu.2gb
    match_all: true
    playbook: playbooks/edge-connector.yml
    update: cd /opt/edge-connector && docker compose pull && docker compose up -d

  # Twingate connector: thin LXC running the official docker image, one per
  # cluster node. Tokens are minted in the Twingate console (one access +
  # one refresh per connector) and pasted at deploy time. Stored on the
  # guest as /etc/twingate/.env so updates re-use them.
  - name: twingate-connector
    type: lxc
    image: debian-13
    flavor: 1vcpu.2gb
    match_all: true
    secrets:
      - name: TWINGATE_ACCESS_TOKEN
        prompt: Access token (Twingate console → Connectors → Add)
      - name: TWINGATE_REFRESH_TOKEN
        prompt: Refresh token (paired with the access token above)
    # Note the $${} escape: loader leaves `${TWINGATE_*_TOKEN}` literal so
    # the SECRETS prompt's runtime values reach the shell. ${TWINGATE_NETWORK}
    # (single $) is loader-substituted from cluster.env since the value is
    # the same across all replicas.
    post_deploy: |
      mkdir -p /etc/twingate
      cat >/etc/twingate/.env <<EOF
      TWINGATE_NETWORK=${TWINGATE_NETWORK}
      TWINGATE_ACCESS_TOKEN=$${TWINGATE_ACCESS_TOKEN}
      TWINGATE_REFRESH_TOKEN=$${TWINGATE_REFRESH_TOKEN}
      EOF
      chmod 600 /etc/twingate/.env
      apt-get update -qq && apt-get install -y docker.io
      # `--sysctl net.ipv4.ping_group_range=...` is intentionally NOT set:
      # that sysctl isn't network-namespaced, so docker-in-unprivileged-LXC
      # can't write it. If you need ICMP from inside the container, set the
      # value on the PVE node instead and the LXC inherits it.
      docker run -d \
        --env-file /etc/twingate/.env \
        --env TWINGATE_LABEL_HOSTNAME="$(hostname)" \
        --env TWINGATE_LABEL_DEPLOYED_BY="murmur" \
        --name twingate-connector \
        --restart=unless-stopped \
        --pull=always \
        twingate/connector:1
    update: docker pull twingate/connector:1 && docker restart twingate-connector

# Cluster-wide fallback for the guest description, applied ONLY to deploys
# whose app declares no `route:` of its own. Murmur stamps this template on the
# guest (substituting {name} = guest hostname, {app} = apps: catalog name) and
# an external sync (Traefik, Caddy, ...) reads the description to publish the
# route. There is NO {port} placeholder — murmur can't see the guest's
# listening port (it's in the app's compose file on the guest); put the port in
# a per-app `route:` instead. Omit this section to stamp nothing by default.
reverse_proxy:
  description_template: "traefik:{name}:80"

# Observability URLs. Surfaced in the TUI as links; not required.
monitoring:
  grafana:    https://grafana.example.net
  loki:       https://loki.example.net
  prometheus: https://prom.example.net

# Optional shared-storage backends murmur knows how to wire into VMs.
# Type is the protocol (smb | nfs). TrueNAS/Unraid present as SMB or NFS,
# so no special-cased types are needed.
storage_backends:
  - name: nas
    type: smb
    host: 10.0.0.20
    share: share
    username: ${NAS_USER}
    password: ${NAS_PASS}
